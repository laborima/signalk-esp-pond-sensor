# SignalK Pi Pond Video Configuration
# Raspberry Pi Zero WH with Camera Module v3
# H.264 Hardware Encoding Edition

device:
  name: "pi-pond-cam"
  # API port for HTTP control interface
  api_port: 8080
  # Host to bind to (0.0.0.0 for all interfaces)
  host: "0.0.0.0"
  # RTSP streaming port (for VLC, etc.)
  rtsp_port: 8554
  # HLS streaming port (for browser playback)
  hls_port: 8888

camera:
  # Resolution: 640x480 (VGA - highly recommended for Pi Zero), 1280x720 (HD, can freeze on Pi Zero), 1920x1080
  resolution: "640x480"
  # Framerate: 15 is perfectly optimized for the Pi Zero WH to prevent CPU choking and frame drops
  framerate: 15
  # H.264 bitrate in bits per second (700 Kbps is perfect for 15 fps VGA quality)
  bitrate: 700000
  # H.264 CRF quality: 18-28 range, lower = better quality (22 is good balance)
  quality: 22
  # Focus mode (Camera Module v3 / imx708 autofocus):
  #   continuous = AF hunts constantly (blurs fixed scenes - avoid)
  #   auto       = AF focuses once at startup then locks
  #   manual     = fixed lens at lens_position (recommended for a static pond)
  focus_mode: "continuous"
  # Manual lens position in dioptres: 0 = infinity (far/pond),
  # higher = closer (~10 = 10 cm minimum focus). Only used in manual mode.
  lens_position: 10.0
  # AF scan range for auto/continuous: normal, macro, full
  # ('full' lets the one-shot autofocus lock onto close subjects too)
  autofocus_range: "full"
  # Camera rotation: 0, 90, 180, 270
  rotation: 180
  # Horizontal flip
  hflip: false
  # Vertical flip
  vflip: false

power:
  # Auto-sleep after inactivity (seconds)
  auto_sleep_timeout: 600
  # Night standby mode
  night_standby:
    enabled: true
    # Start hour (24h format)
    start_hour: 22
    # End hour (24h format)
    end_hour: 7

# BH1750FVI light sensor (I2C)
# Wiring: VCC->3.3V (pin 1), GND->pin 6, SDA->GPIO2 (pin 3), SCL->GPIO3 (pin 5)
# ADDR->GND or floating = 0x23, ADDR->3.3V = 0x5C
light_sensor:
  enabled: true
  i2c_bus: 1
  address: "0x23"
  # Publish interval in seconds
  interval: 60
  # SignalK path (distinct from the ESP32 sensor's environment.inside.pond.illuminance)
  signalk_path: "environment.outside.pond.illuminance"

# MQTT broker used to push SignalK deltas (same broker as the ESP32 sensor)
mqtt:
  host: "192.168.1.16"
  port: 1883
  topic: "signalk/delta"

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_file: "/var/log/signalk_pi_pond_video.log"
