# SignalK Pi Pond Video Configuration
# Raspberry Pi Zero WH with Camera Module v3
# H.264 Hardware Encoding Edition

device:
  name: "pi-pond-cam"
  # API port for HTTP control interface
  api_port: 8080
  # Host to bind to (0.0.0.0 for all interfaces)
  host: "0.0.0.0"
  # RTSP streaming port (for VLC, etc.)
  rtsp_port: 8554
  # HLS streaming port (for browser playback)
  hls_port: 8888

camera:
  # Resolution: 1280x720 (Best HD balance for Pi Zero), 1920x1080 (Full HD, can buffer on Wi-Fi), 640x480 (SD)
  resolution: "1280x720"
  # Framerate: 25 for smooth H.264 streaming (Pi Zero can handle this with hardware encoding)
  framerate: 25
  # H.264 bitrate in bits per second (3 Mbps for excellent 720p quality)
  bitrate: 3000000
  # H.264 CRF quality: 18-28 range, lower = better quality (20 is very crisp)
  quality: 20
  # Camera rotation: 0, 90, 180, 270
  rotation: 180
  # Horizontal flip
  hflip: false
  # Vertical flip
  vflip: true

power:
  # Auto-sleep after inactivity (seconds)
  auto_sleep_timeout: 600
  # Night standby mode
  night_standby:
    enabled: true
    # Start hour (24h format)
    start_hour: 22
    # End hour (24h format)
    end_hour: 7

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_file: "/var/log/signalk_pi_pond_video.log"
